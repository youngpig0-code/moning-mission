<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아침 미션 인증 앱 (홍리안 · 홍지운)</title>

    html, body {

      padding: 0;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFDF7;
      color: #1e293b;

    .app-header {
      position: sticky;

      background-color: #fbbf24;
      color: #0f172a;

    }
    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 16px;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qr-btn {

      background-color: #fde68a;
      color: #0f172a;
      font-weight: 800;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .nav-group {
      display: flex;
      background-color: rgba(217, 119, 6, 0.35);
      padding: 3px;
      border-radius: 12px;
      gap: 3px;
    }
